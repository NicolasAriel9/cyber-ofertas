# Scheduled offer scraper. Runs on GitHub Actions instead of a Render cron
# job because Render cron has no free plan (min US$1/month + a card on file).
# The repo is public, so standard runners have unlimited free minutes.
#
# Two kinds of runs, only during Cyber Monday (Oct 4-8, UTC):
#   - quick, every 5 min (GitHub's minimum): first pages of each department (new and featured
#     deals); never deactivates listings.
#   - full, every 3 hours: every department up to SCRAPE_MAX_PAGES; marks
#     offers that disappeared as inactive.
# Each big store runs as its own parallel job, and the brand stores as one job
# per platform, so a full sweep takes as long as the slowest job (~20 min)
# instead of all of them in a row.
# Outside an event window the scraper no-ops (see app/scraper/event_windows.py).
# For the next event, update the dates below and KNOWN_EVENTS.
#
# GitHub may start scheduled runs late when it's busy -- or drop them: on
# Oct 4 2026 the */5 schedule produced 5 runs in 8 hours. So runs also chain:
# the "next" job of a scheduled or chained run dispatches the next run 5
# minutes after its own start (workflow_dispatch from GITHUB_TOKEN is one of
# the events GitHub does run). The chain picks full mode when no full sweep
# started in the last 3 hours, stops itself outside the event window, and a
# shared concurrency group keeps a single chain alive even when a scheduled
# run starts a second one. Any scheduled run restarts a chain that died.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME

name: Scrape offers
# The chain reads the mode from here to know when the last full sweep ran.
run-name: Scrape ${{ inputs.mode || (github.event.schedule == '0 */3 4-8 10 *' && 'full' || 'quick') }}${{ inputs.chain && ' (cadena)' || '' }}

on:
  schedule:
    - cron: "0 */3 4-8 10 *" # full
    # quick. At :00 of a full-sweep hour both fire; the per-store concurrency
    # group below makes the second one wait for the first.
    - cron: "*/5 * 4-8 10 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "quick = first pages only, full = whole catalog"
        type: choice
        options: [quick, full]
        default: quick
      force:
        description: "Scrape even outside the Cyber event window"
        type: boolean
        default: true
      stores:
        description: "Only these jobs (comma-separated, e.g. falabella,marcas-vtex). Empty = all."
        type: string
        default: ""
      chain:
        description: "Dispatch the next run 5 minutes after this one starts (set by the chain itself)"
        type: boolean
        default: false

env:
  API_URL: https://cyber-ofertas-api.onrender.com

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Big retailers get one job each; the ~200 brand stores are batched
        # into one job per platform (see app/scraper/stores/brand_sites.py).
        # jetsmart and cocha are the travel section (app/scraper/stores/travel.py).
        store: [falabella, paris, ripley, hites, sodimac, easy, jumbo, mercadolibre, jetsmart, cocha,
                marcas-shopify-1, marcas-shopify-2, marcas-shopify-3, marcas-vtex, marcas-magento]
    # One run per store at a time. A quick run that arrives while that store's
    # full sweep is running waits (and newer quick runs replace older waiting ones).
    concurrency:
      group: scrape-${{ matrix.store }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    steps:
      # Render's free plan puts the API to sleep after 15 minutes without
      # requests and waking it takes about a minute; the scrape jobs run all
      # the time during the event, so each one pings it on the way in.
      - name: Keep the API awake
        working-directory: .
        run: curl -sS -m 90 -o /dev/null "$API_URL/healthz" || true

      # matrix isn't available in a job-level `if`, so the "stores" filter of
      # a manual run is applied here and the remaining steps are skipped.
      - name: Selected?
        id: sel
        working-directory: .
        env:
          STORES_INPUT: ${{ inputs.stores }}
          STORE: ${{ matrix.store }}
        run: |
          stores="$(echo "$STORES_INPUT" | tr -d ' ')"
          if [ -z "$stores" ] || [[ ",$stores," == *",$STORE,"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.sel.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.sel.outputs.run == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
        if: steps.sel.outputs.run == 'true'

      - name: Apply migrations
        if: steps.sel.outputs.run == 'true' && matrix.store == 'falabella'
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Scrape ${{ matrix.store }}
        if: steps.sel.outputs.run == 'true'
        run: python -m app.scraper.cyber_scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          SCRAPE_STORES: ${{ matrix.store }}
          SCRAPE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 */3 4-8 10 *' && 'full' || 'quick') }}
          FORCE_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}

  next:
    # Cancelling a run by hand ends the chain.
    needs: scrape
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.chain) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    # A newer chain link replaces one still waiting, so parallel chains merge.
    concurrency:
      group: scrape-chain
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep the API awake
        run: curl -sS -m 90 -o /dev/null "$API_URL/healthz" || true

      - uses: actions/checkout@v4
        with:
          sparse-checkout: backend/app

      - name: Still in the event window?
        id: window
        working-directory: backend
        run: |
          python3 -c "
          from app.scraper.event_windows import is_scrape_window_active
          print('active=' + str(is_scrape_window_active()).lower())
          " >> "$GITHUB_OUTPUT"

      - name: Dispatch the next run
        if: steps.window.outputs.active == 'true'
        run: |
          started=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          wait=$(( $(date -d "$started" +%s) + 300 - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent_full=$(gh run list --workflow scrape.yml --limit 100 --json displayTitle,createdAt,conclusion --jq "[.[] | select((.displayTitle | startswith(\"Scrape full\")) and .createdAt > \"$since\" and .conclusion != \"cancelled\")] | length")
          mode=quick
          if [ "$recent_full" = "0" ]; then mode=full; fi
          echo "Next run: $mode"
          gh workflow run scrape.yml --ref "${{ github.ref_name }}" -f mode="$mode" -f force=false -f chain=true
