# Scheduled offer scraper. Runs on GitHub Actions instead of a Render cron
# job because Render cron has no free plan (min US$1/month + a card on file).
#
# Budget: private repos get 2,000 free Actions minutes/month and a full sweep
# takes ~50 min, so the schedule is limited to the Cyber Monday days
# (Oct 4-8, UTC) every 3 hours: ~28 sweeps = ~1,400 min. Outside an event
# window the scraper no-ops in about a minute (see app/scraper/event_windows.py).
# For the next event, update the dates below and KNOWN_EVENTS.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL, TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME

name: Scrape offers

on:
  schedule:
    - cron: "0 */3 4-8 10 *"
  workflow_dispatch:
    inputs:
      force:
        description: "Scrape even outside the Cyber event window"
        type: boolean
        default: true
      stores:
        description: "Only these stores (comma-separated, e.g. falabella,paris). Empty = all."
        type: string
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Scrape
        run: python -m app.scraper.cyber_scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          FORCE_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
          SCRAPE_STORES: ${{ inputs.stores }}
