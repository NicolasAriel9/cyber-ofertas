# Render Blueprint for Cyber Ofertas.
#
# Usage (once the repo is pushed to GitHub): in the Render dashboard, "New +"
# -> "Blueprint", point it at this repo. Render will read this file and
# create both services below in one go. You'll be prompted for every
# `sync: false` value (secrets) during setup.
#
# Database: uses an external Neon Postgres instance (DATABASE_URL), not
# Render's own managed Postgres -- Render's free Postgres tier expires after
# 30 days, Neon's free tier doesn't. Pick the same region for both (Render
# "ohio" + Neon "AWS US East 2 (Ohio)") to keep API -> DB latency low.
#
# The scheduled scraper is NOT here: Render cron has no free plan, so it runs
# on GitHub Actions instead (.github/workflows/scrape.yml).

services:
  - name: cyber-ofertas-api
    type: web
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    # Secrets live on the service itself: Render ignores `sync: false` inside
    # environment groups, so it would never prompt for them there.
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false # from @BotFather
      - key: TELEGRAM_BOT_USERNAME
        sync: false # bot's @username, without the @
      - key: DEFAULT_DROP_ALERT_THRESHOLD_PCT
        value: "5.0"
      - key: PYTHON_VERSION
        value: "3.14.7"

  - name: cyber-ofertas-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        sync: false # the API's public URL (https://cyber-ofertas-api-xxxx.onrender.com), baked in at build time
